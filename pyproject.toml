[project]
name = "youtube-mcp-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mukesh Patel", email = "muke230101006@iiitmanipur.ac.in" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.16",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
